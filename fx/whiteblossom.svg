      <g transform="translate(262.4 219.7) rotate(334.4) scale(1.01)"><g class="petal p18 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(500.7 506.2) rotate(184.6) scale(0.84)"><g class="petal p21 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(499.1 533.1) rotate(334.8) scale(0.98)"><g class="petal p24 b0"><use href="#wleaf"/></g></g>
      <g transform="translate(234.5 372.1) rotate(14.7) scale(0.90)"><g class="petal p27 b3"><use href="#wleaf"/></g></g>
    </g>
    <g class="orbit o1">
      <g transform="translate(547.1 397.3) rotate(53.4) scale(0.84)"><g class="petal p1 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(236.7 526.6) rotate(289.1) scale(0.93)"><g class="petal p4 b0"><use href="#wleaf"/></g></g>
      <g transform="translate(195.2 344.9) rotate(288.5) scale(0.91)"><g class="petal p7 b3"><use href="#wleaf"/></g></g>
      <g transform="translate(582.7 271.8) rotate(320.6) scale(0.83)"><g class="petal p10 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(359.5 324.1) rotate(75.3) scale(1.08)"><g class="petal p13 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(292.5 420.8) rotate(223.3) scale(1.18)"><g class="petal p16 b0"><use href="#wleaf"/></g></g>
      <g transform="translate(527.4 368.7) rotate(183.3) scale(0.73)"><g class="petal p19 b3"><use href="#wleaf"/></g></g>
      <g transform="translate(362.5 181.9) rotate(230.8) scale(1.07)"><g class="petal p22 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(388.3 562.2) rotate(136.5) scale(0.88)"><g class="petal p25 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(269.1 533.1) rotate(132.2) scale(0.86)"><g class="petal p28 b0"><use href="#wleaf"/></g></g>
    </g>
    <g class="orbit o2">
      <g transform="translate(333.1 516.4) rotate(38.8) scale(0.88)"><g class="petal p2 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(370.2 202.8) rotate(142.6) scale(1.06)"><g class="petal p5 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(324.3 329.2) rotate(253.9) scale(0.70)"><g class="petal p8 b0"><use href="#wleaf"/></g></g>
      <g transform="translate(321.3 471.0) rotate(253.9) scale(0.84)"><g class="petal p11 b3"><use href="#wleaf"/></g></g>
      <g transform="translate(478.8 453.6) rotate(182.1) scale(1.06)"><g class="petal p14 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(584.4 477.2) rotate(228.2) scale(0.70)"><g class="petal p17 b1"><use href="#wleaf"/></g></g>
      <g transform="translate(325.0 300.3) rotate(70.9) scale(0.99)"><g class="petal p20 b0"><use href="#wleaf"/></g></g>
      <g transform="translate(229.2 395.3) rotate(172.2) scale(0.73)"><g class="petal p23 b3"><use href="#wleaf"/></g></g>
      <g transform="translate(186.4 470.4) rotate(349.5) scale(0.75)"><g class="petal p26 b2"><use href="#wleaf"/></g></g>
      <g transform="translate(563.2 378.4) rotate(350.2) scale(0.79)"><g class="petal p29 b1"><use href="#wleaf"/></g></g>
    </g>

    <g transform="translate(252.6 351.7)"><g class="drift wf0" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.87)"/></g></g>
    <g transform="translate(324.9 340.5)"><g class="drift wf1" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.72)"/></g></g>
    <g transform="translate(292.6 337.8)"><g class="drift wf2" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.74)"/></g></g>
    <g transform="translate(433.7 262.6)"><g class="drift wf3" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.78)"/></g></g>
    <g transform="translate(352.3 524.2)"><g class="drift wf4" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.65)"/></g></g>
    <g transform="translate(268.8 384.2)"><g class="drift wf5" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.69)"/></g></g>
    <g transform="translate(363.9 484.7)"><g class="drift wf6" style="transform-box: fill-box; transform-origin: 50% 50%;"><use href="#wleaf" transform="scale(0.66)"/></g></g>
