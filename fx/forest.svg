<?xml version="1.0" encoding="UTF-8"?>
<!--
  숲의정령(forest_spirit) — cards.js의 cast: 'forest'
  기준점(타워 중심) = (400, 400) · 반지름 380 (타워 3개가 들어가는 원) · 전체 길이 5.4초
  설치형 회복이라 회복(5초)이 도는 동안 토템이 남아 있는다.
  가운데 나무를 기준으로 초록 초원이 깔리고, 토템 고리가 천천히 돌며 풀이 돋는다.
  ※ 이 파일은 fx/forest.gen.py가 만들어 낸다 — 손으로 고치지 말고 그 스크립트를 고쳐 다시 실행할 것
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="fGround">
      <stop offset="0%"   stop-color="#b9f7c8" stop-opacity="0.34"/>
      <stop offset="45%"  stop-color="#6fd98c" stop-opacity="0.24"/>
      <stop offset="82%"  stop-color="#3fae6a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2f9158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fBlade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#3da65f"/>
      <stop offset="60%"  stop-color="#7fe09a"/>
      <stop offset="100%" stop-color="#d6ffe3"/>
    </linearGradient>
    <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="fHalo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 풀 한 포기 (밑동이 0,0) -->
    <g id="grass" filter="url(#fSoft)" fill="none" stroke="url(#fBlade)" stroke-width="3" stroke-linecap="round">
      <path d="M 0 0 C 1 -8 3 -14 6 -19"/>
      <path d="M 0 0 C 0 -10 0 -17 -1 -23"/>
      <path d="M 0 0 C -1 -8 -4 -13 -7 -17"/>
    </g>

    <!-- 떠오르는 잎 -->
    <g id="leaf">
      <path d="M 0 0 C 5 -4 9 -9 8 -14 C 4 -14 -1 -10 -2 -5 Z" fill="#9dedb4" opacity="0.9"/>
    </g>
  </defs>

  <style>
    .all, .ground, .ring, .tree { transform-box: view-box; transform-origin: 400px 400px; }

    /* 끝날 때 통째로 스르륵 사라진다 */
    .all { animation: fade 5.4s linear both; }
    @keyframes fade {
      0%, 87% { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* 초원이 깔린다 */
    .ground { animation: ground 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    @keyframes ground {
      0%   { transform: scale(0.15); opacity: 0; }
      70%  { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }

    /* 토템 고리 — 두 겹이 반대로 천천히 돈다 */
    .ring-out { animation: ringin 0.6s ease-out 0.1s both, spin 26s linear 0.1s infinite; }
    .ring-in  { animation: ringin 0.6s ease-out 0.2s both, spinb 19s linear 0.2s infinite; }
    @keyframes ringin {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes spin  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
    @keyframes spinb { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }

    /* 풀이 돋아 바람에 흔들린다 */
    .tuft {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation-name: grow, sway;
      animation-duration: 0.5s, 3.2s;
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1), ease-in-out;
      animation-fill-mode: both, both;
      animation-iteration-count: 1, infinite;
    }
    @keyframes grow {
      0%   { transform: scaleY(0.05) scaleX(0.7); opacity: 0; }
      60%  { transform: scaleY(1.12) scaleX(1);   opacity: 1; }
      100% { transform: scaleY(1)    scaleX(1);   opacity: 1; }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }
    .g1 { animation-duration: 0.5s, 3.8s; }
    .g2 { animation-duration: 0.5s, 2.9s; }
    .g3 { animation-duration: 0.5s, 4.4s; }

    .t0 { animation-delay: 0.37s, 1.27s; }
    .t1 { animation-delay: 0.30s, 1.20s; }
    .t2 { animation-delay: 0.28s, 1.18s; }
    .t3 { animation-delay: 0.53s, 1.43s; }
    .t4 { animation-delay: 0.26s, 1.16s; }
    .t5 { animation-delay: 0.44s, 1.34s; }
    .t6 { animation-delay: 0.41s, 1.31s; }
    .t7 { animation-delay: 0.57s, 1.47s; }
    .t8 { animation-delay: 0.40s, 1.30s; }
    .t9 { animation-delay: 0.49s, 1.39s; }
    .t10 { animation-delay: 0.30s, 1.20s; }
    .t11 { animation-delay: 0.30s, 1.20s; }
    .t12 { animation-delay: 0.45s, 1.35s; }
    .t13 { animation-delay: 0.62s, 1.52s; }
    .t14 { animation-delay: 0.60s, 1.50s; }
    .t15 { animation-delay: 0.46s, 1.36s; }
    .t16 { animation-delay: 0.30s, 1.20s; }
    .t17 { animation-delay: 0.46s, 1.36s; }
    .t18 { animation-delay: 0.58s, 1.48s; }
    .t19 { animation-delay: 0.41s, 1.31s; }
    .t20 { animation-delay: 0.41s, 1.31s; }
    .t21 { animation-delay: 0.27s, 1.17s; }
    .t22 { animation-delay: 0.58s, 1.48s; }
    .t23 { animation-delay: 0.65s, 1.55s; }
    .t24 { animation-delay: 0.42s, 1.32s; }
    .t25 { animation-delay: 0.34s, 1.24s; }
    .t26 { animation-delay: 0.31s, 1.21s; }
    .t27 { animation-delay: 0.52s, 1.42s; }
    .t28 { animation-delay: 0.34s, 1.24s; }
    .t29 { animation-delay: 0.30s, 1.20s; }
    .t30 { animation-delay: 0.37s, 1.27s; }
    .t31 { animation-delay: 0.57s, 1.47s; }
    .t32 { animation-delay: 0.52s, 1.42s; }
    .t33 { animation-delay: 0.48s, 1.38s; }

    /* 가운데 나무 — 톡 튀어나온 뒤 숨쉬듯 흔들린다 */
    .tree { animation: pop 0.55s cubic-bezier(0.2, 1.3, 0.4, 1) 0.08s both, bob 2.8s ease-in-out 0.7s infinite; }
    @keyframes pop {
      0%   { transform: scale(0.2) translateY(16px); opacity: 0; }
      100% { transform: scale(1)   translateY(0);    opacity: 1; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0)    scale(1); }
      50%      { transform: translateY(-7px) scale(1.04); }
    }

    @keyframes lf0 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(49px,-102px) rotate(140deg) scale(1); opacity: 0; }
    }
    .lf0 { animation: lf0 2.6s ease-out 1.85s infinite; }
    @keyframes lf1 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(-66px,-148px) rotate(-97deg) scale(1); opacity: 0; }
    }
    .lf1 { animation: lf1 2.6s ease-out 0.84s infinite; }
    @keyframes lf2 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(61px,-91px) rotate(200deg) scale(1); opacity: 0; }
    }
    .lf2 { animation: lf2 2.6s ease-out 1.07s infinite; }
    @keyframes lf3 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(-41px,-113px) rotate(176deg) scale(1); opacity: 0; }
    }
    .lf3 { animation: lf3 2.6s ease-out 2.06s infinite; }
    @keyframes lf4 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(-58px,-110px) rotate(180deg) scale(1); opacity: 0; }
    }
    .lf4 { animation: lf4 2.6s ease-out 1.94s infinite; }
    @keyframes lf5 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(40px,-130px) rotate(132deg) scale(1); opacity: 0; }
    }
    .lf5 { animation: lf5 2.6s ease-out 2.34s infinite; }
    @keyframes lf6 {
      0%   { transform: translate(0,0) rotate(0deg) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translate(31px,-140px) rotate(-164deg) scale(1); opacity: 0; }
    }
    .lf6 { animation: lf6 2.6s ease-out 0.62s infinite; }
  </style>

  <g class="all">
    <ellipse class="ground" cx="400" cy="400" rx="275" ry="258" fill="url(#fGround)"/>

    <g class="ring ring-out" fill="none" stroke="#a6f4bd" stroke-width="3" stroke-linecap="round"
       opacity="0.55" filter="url(#fHalo)">
      <ellipse cx="400" cy="400" rx="268" ry="252" stroke-dasharray="46 34"/>
    </g>
    <g class="ring ring-in" fill="none" stroke="#c9ffd9" stroke-width="2.5" stroke-linecap="round"
       opacity="0.45" filter="url(#fHalo)">
      <ellipse cx="400" cy="400" rx="202" ry="190" stroke-dasharray="20 44"/>
    </g>

