<?xml version="1.0" encoding="UTF-8"?>
<!--
  토네이도(tornado) — 바람의 진화. cards.js의 cast: 'tornado'
  기준점(소용돌이 발 밑) = (200, 300)

  돌(stone.svg)과 같은 이유로 이 파일에는 '전진'이 없다.
  설치한 타일에 따라 가는 거리·속도·크기가 달라지기 때문에, 이동과 확대는
  board.js가 Web Animations API로 그린다. 여기서는 제자리에서 도는 소용돌이만
  그리고, 회전은 무한 반복이라 어떤 이동 시간에도 맞는다.

  도형처럼 보이지 않게 하는 것:
   1) #churn — feTurbulence + feDisplacementMap으로 깔때기 윤곽을 계속 흔든다
   2) 층층이 도는 띠 — 위아래 띠의 속도를 다르게 해야 '도는 기둥'으로 읽힌다
      (한 덩어리로 돌리면 그냥 회전하는 그림처럼 보인다)
   3) 빨려 들어가는 부스러기 — 바깥에서 안쪽으로 감기며 위로 빨려 올라간다
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <linearGradient id="funnelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dfe9f2" stop-opacity="0.72"/>
      <stop offset="42%"  stop-color="#aabdd0" stop-opacity="0.6"/>
      <stop offset="78%"  stop-color="#7d92a8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#5d7288" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="litG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dustG">
      <stop offset="0%"   stop-color="#cfd8e2" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#c3ccd8" stop-opacity="0.3"/>
      <stop offset="88%"  stop-color="#9daabb" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8b98a9" stop-opacity="0"/>
    </radialGradient>

    <filter id="churn" x="-70%" y="-70%" width="240%" height="240%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.03" numOctaves="3" seed="9" result="n">
        <animate attributeName="seed" values="9;38;9" dur="1.1s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softer" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <style>
      /* 띠마다 도는 속도를 다르게 — 아래(좁은 쪽)가 더 빠르다 */
      .b  { transform-box: view-box; animation-timing-function: linear;
            animation-iteration-count: infinite; }
      .b1 { transform-origin: 200px  66px; animation: spin 0.66s; }
      .b2 { transform-origin: 200px  96px; animation: spin 0.58s; }
      .b3 { transform-origin: 200px 128px; animation: spin 0.5s;  }
      .b4 { transform-origin: 200px 160px; animation: spin 0.43s; }
      .b5 { transform-origin: 200px 192px; animation: spin 0.36s; }
      .b6 { transform-origin: 200px 222px; animation: spin 0.3s;  }
      .b7 { transform-origin: 200px 250px; animation: spin 0.25s; }
      .b8 { transform-origin: 200px 274px; animation: spin 0.2s;  }

      /* 3차원으로 도는 것처럼 — 가로만 눌렸다 펴진다 */
      @keyframes spin {
        0%   { transform: scaleX(1);     }
        25%  { transform: scaleX(0.22);  }
        50%  { transform: scaleX(-1);    }
        75%  { transform: scaleX(-0.22); }
        100% { transform: scaleX(1);     }
      }

      .base { transform-box: view-box; transform-origin: 200px 300px;
              animation: base 0.7s ease-in-out infinite alternate; }
      @keyframes base {
        from { transform: scale(1, 1);       opacity: 0.55; }
        to   { transform: scale(1.12, 0.88); opacity: 0.32; }
      }

      /* 빨려 올라가는 부스러기 */
      .d  { transform-box: view-box; animation: suck 0.9s linear infinite; }
      .d2 { animation-delay: -0.18s; } .d3 { animation-delay: -0.36s; }
      .d4 { animation-delay: -0.54s; } .d5 { animation-delay: -0.72s; }
      @keyframes suck {
        0%   { transform: translate(0, 0) scale(1);     opacity: 0;   }
        14%  { opacity: 0.85; }
        100% { transform: translate(6px, -232px) scale(0.3); opacity: 0; }
      }
    </style>
  </defs>

  <!-- ── 바닥에서 이는 먼지 ───────────────────────────────── -->
  <ellipse class="base" cx="200" cy="300" rx="104" ry="30" fill="url(#dustG)" filter="url(#softer)"/>

  <!-- ── 깔때기 ───────────────────────────────────────────── -->
  <g filter="url(#churn)">
    <!-- 전체 실루엣 — 옆선이 오목하게 휘어야 기둥이 아니라 소용돌이로 읽힌다 -->
    <path d="M74,44 C120,32 280,32 326,44
             C300,118 252,206 226,282
             C218,294 182,294 174,282
             C148,206 100,118 74,44 Z"
          fill="url(#funnelG)"/>

    <!-- 층층이 도는 띠 — 얇게, 아래로 갈수록 빠르게 -->
    <g fill="#eef4fa">
      <ellipse class="b b1" cx="200" cy="66"  rx="118" ry="9"   opacity="0.42"/>
      <ellipse class="b b2" cx="200" cy="96"  rx="104" ry="8.5" opacity="0.46"/>
      <ellipse class="b b3" cx="200" cy="128" rx="88"  ry="8"   opacity="0.5"/>
      <ellipse class="b b4" cx="200" cy="160" rx="72"  ry="7.5" opacity="0.54"/>
      <ellipse class="b b5" cx="200" cy="192" rx="56"  ry="7"   opacity="0.58"/>
      <ellipse class="b b6" cx="200" cy="222" rx="42"  ry="6"   opacity="0.6"/>
      <ellipse class="b b7" cx="200" cy="250" rx="30"  ry="5"   opacity="0.62"/>
      <ellipse class="b b8" cx="200" cy="274" rx="20"  ry="4"   opacity="0.6"/>
    </g>

    <!-- 띠 사이 그늘 — 층이 겹쳐 보이게 -->
    <g fill="#46586c" opacity="0.32">
      <ellipse class="b b2" cx="200" cy="81"  rx="110" ry="5"/>
      <ellipse class="b b4" cx="200" cy="144" rx="80"  ry="4.5"/>
      <ellipse class="b b6" cx="200" cy="207" rx="49"  ry="4"/>
      <ellipse class="b b8" cx="200" cy="262" rx="25"  ry="3"/>
    </g>

    <!-- 가운데로 갈수록 어두운 속 — 속이 빈 기둥처럼 보이게 -->
    <path d="M138,48 C168,40 232,40 262,48
             C244,120 216,208 208,278
             C204,286 196,286 192,278
             C184,208 156,120 138,48 Z"
          fill="#3e4f62" opacity="0.3"/>

    <!-- 왼쪽에서 드는 빛 -->
    <path d="M86,48 C124,38 168,36 190,38
             C170,120 182,214 180,282
             C176,288 170,286 174,282
             C148,206 104,118 86,48 Z"
          fill="url(#litG)" opacity="0.75"/>
  </g>

  <!-- ── 빨려 올라가는 부스러기 ───────────────────────────── -->
  <g filter="url(#soft)" fill="#dde5ee">
    <ellipse class="d"    cx="146" cy="282" rx="9"   ry="4"/>
    <ellipse class="d d2" cx="252" cy="288" rx="7.5" ry="3.4"/>
    <ellipse class="d d3" cx="168" cy="292" rx="6"   ry="3"/>
    <ellipse class="d d4" cx="236" cy="278" rx="8"   ry="3.6"/>
    <ellipse class="d d5" cx="200" cy="294" rx="6.5" ry="3"/>
  </g>
</svg>
